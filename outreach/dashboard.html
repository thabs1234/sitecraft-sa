<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteCraft SA — Outreach Dashboard</title>
<style>
:root{--g:#0a7d4d;--d:#06402b}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;color:#142;background:#eef7f1}
header{background:linear-gradient(135deg,var(--g),var(--d));color:#fff;padding:18px 22px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:1.25rem}header .sub{font-size:.85rem;opacity:.9;margin-top:4px}
.wrap{max-width:920px;margin:0 auto;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.bar select,.bar input{padding:9px 11px;border:1px solid #cdeede;border-radius:10px;font-size:.95rem}
.bar input{flex:1;min-width:160px}
.progress{background:#fff;border:1px solid #cdeede;border-radius:12px;padding:12px 16px;margin:10px 0;text-align:center}
.progress b{color:var(--g);font-size:1.4rem}
.big{display:block;width:100%;padding:16px;background:var(--g);color:#fff;border:0;border-radius:14px;font-size:1.1rem;font-weight:700;cursor:pointer;margin:8px 0}
.big:active{transform:translateY(1px)}
.note{font-size:.82rem;color:#567;text-align:center;margin-bottom:14px}
.lead{background:#fff;border:1px solid #cdeede;border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lead .info{flex:1;min-width:180px}
.lead .nm{font-weight:700}.lead .mt{font-size:.82rem;color:#567}
.lead button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.open{background:var(--g);color:#fff}
.copy{background:#d7ecdf;color:var(--d)}
.sent{background:#cfeede;color:var(--d);text-decoration:line-through;opacity:.7}
.toggle{background:#f4fbf7;color:var(--d);border:1px solid #cdeede}
.export{background:#06402b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;margin-top:10px}
</style></head>
<body>
<header><h1>SiteCraft SA — Outreach Dashboard</h1>
<div class="sub">Click-to-send queue for township leads. Manual = ban-safe on WhatsApp Business.</div></header>
<div class="wrap">
  <div class="progress">Sent: <b id="cnt">0</b> / <span id="total">0</span> with phone &nbsp;·&nbsp; <span id="left"></span> left</div>
  <div class="bar">
    <select id="town"><option value="">All towns</option></select>
    <select id="status">
      <option value="all">All</option>
      <option value="phone">Has phone</option>
      <option value="nophone">No phone</option>
      <option value="unsent">Unsent only</option>
      <option value="sent">Sent only</option>
    </select>
    <input id="q" placeholder="Search business name…">
  </div>
  <button class="big" id="next">▶ Open next unsent (with phone)</button>
  <div class="note">Opens WhatsApp with the pitch pre-typed. Send it, then it auto-marks done. Progress saved on this device.</div>
  <div id="list"></div>
  <button class="export" id="exp">⬇ Export sent leads (CSV)</button>
</div>

const KEY = "sitecraft_sent_v1";
let sent = JSON.parse(localStorage.getItem(KEY) || "{}");
function save(){ localStorage.setItem(KEY, JSON.stringify(sent)); }
function isSent(r){ return !!sent[r.id]; }
function refresh(){
  document.getElementById("total").textContent = LEADS.filter(r=>r.wa_link).length;
  document.getElementById("cnt").textContent = LEADS.filter(r=>r.wa_link && isSent(r)).length;
  document.getElementById("left").textContent = (LEADS.filter(r=>r.wa_link).length - LEADS.filter(r=>r.wa_link && isSent(r)).length);
  const townSel = document.getElementById("town");
  if(townSel.options.length<=1){
    [...new Set(LEADS.map(r=>r.town))].sort().forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=t;townSel.appendChild(o);});
  }
  const town=document.getElementById("town").value, st=document.getElementById("status").value, q=document.getElementById("q").value.toLowerCase();
  const list=document.getElementById("list"); list.innerHTML="";
  LEADS.filter(r=>{
    if(town && r.town!==town) return false;
    if(st==="phone" && !r.wa_link) return false;
    if(st==="nophone" && r.wa_link) return false;
    if(st==="unsent" && isSent(r)) return false;
    if(st==="sent" && !isSent(r)) return false;
    if(q && !r.name.toLowerCase().includes(q)) return false;
    return true;
  }).forEach(r=>{
    const d=document.createElement("div"); d.className="lead";
    const info=document.createElement("div"); info.className="info";
    info.innerHTML=`<div class="nm">${r.name}</div><div class="mt">${r.type} · ${r.town}${r.phone?' · '+r.phone:''}</div>`;
    d.appendChild(info);
    if(r.wa_link){
      const b=document.createElement("button");
      b.className=isSent(r)?"sent":"open"; b.textContent=isSent(r)?"✓ Sent":"Open WhatsApp";
      b.onclick=()=>{ window.open(r.wa_link,"_blank"); if(!isSent(r)){sent[r.id]=1;save();refresh();} };
      d.appendChild(b);
    } else {
      const c=document.createElement("button"); c.className="copy"; c.textContent="Copy sample link";
      c.onclick=()=>{ navigator.clipboard.writeText(r.sample_url); c.textContent="Copied!"; setTimeout(()=>c.textContent="Copy sample link",1200); };
      d.appendChild(c);
    }
    const t=document.createElement("button"); t.className="toggle"; t.textContent=isSent(r)?"Undo":"Mark sent";
    t.onclick=()=>{ if(isSent(r)) delete sent[r.id]; else sent[r.id]=1; save(); refresh(); };
    d.appendChild(t);
    list.appendChild(d);
  });
}
document.getElementById("next").onclick=()=>{
  const r=LEADS.find(r=>r.wa_link && !isSent(r));
  if(!r){ alert("All phone leads sent! 🎉"); return; }
  window.open(r.wa_link,"_blank"); sent[r.id]=1; save(); refresh();
  document.getElementById("status").value="unsent";
};
document.getElementById("town").onchange=refresh;
document.getElementById("status").onchange=refresh;
document.getElementById("q").oninput=refresh;
document.getElementById("exp").onclick=()=>{
  const rows=[["town","name","type","phone","sample_url"]];
  LEADS.filter(r=>isSent(r)).forEach(r=>rows.push([r.town,r.name,r.type,r.phone,r.sample_url]));
  const csv=rows.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
  a.download="sitecraft_sent_leads.csv"; a.click();
};
refresh();
